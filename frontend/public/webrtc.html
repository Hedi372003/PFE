<!DOCTYPE html>
<html>
<head>
  <title>Socket.IO WebRTC Test</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    body { background:#111; color:white; text-align:center; }
    video { width:45%; margin:10px; border:2px solid cyan; }
    button { padding:10px 20px; margin:10px; }
  </style>
</head>

<body>

<h2>Socket.IO WebRTC Test</h2>

<video id="localVideo" autoplay muted playsinline></video>
<video id="remoteVideo" autoplay playsinline></video>

<br>

<button onclick="startRobot()">Start Robot</button>
<button onclick="startAdmin()">Start Admin</button>

<p id="status">Connecting...</p>

<script>
const socket = io("https://fuliginously-nonvulcanized-andre.ngrok-free.dev");
const roomId = "robot-1";

let pc;
let localStream;

const localVideo = document.getElementById("localVideo");
const remoteVideo = document.getElementById("remoteVideo");
const status = document.getElementById("status");

socket.on("connect", () => {
  status.innerText = "Connected to Socket.IO ✅";
  socket.emit("join-room", roomId);
});

// Create peer
function createPeer() {
  pc = new RTCPeerConnection({
  iceServers: [
    {
      urls: "stun:stun.l.google.com:19302"
    },
    {
      urls: "turn:openrelay.metered.ca:80",
      username: "openrelayproject",
      credential: "openrelayproject"
    }
  ]
});

pc.oniceconnectionstatechange = () => {
  console.log("ICE state:", pc.iceConnectionState);
};

  pc.onicecandidate = (e) => {
    if (e.candidate) {
      socket.emit("candidate", { roomId, candidate: e.candidate });
    }
  };

  pc.ontrack = (e) => {
    remoteVideo.srcObject = e.streams[0];
  };
}

// Start camera
async function startCamera() {
  localStream = await navigator.mediaDevices.getUserMedia({
    video: true,
    audio: true
  });

  localVideo.srcObject = localStream;

  localStream.getTracks().forEach(track => {
    pc.addTrack(track, localStream);
  });
}

// ADMIN
async function startAdmin() {
  status.innerText = "Admin starting...";

  createPeer();
  await startCamera();

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  socket.emit("offer", { roomId, offer });
}

// ROBOT
async function startRobot() {
  status.innerText = "Robot waiting...";
  createPeer();
}

// RECEIVE OFFER
socket.on("offer", async (offer) => {
  status.innerText = "Robot received offer";
  try{
  await startCamera();

  await pc.setRemoteDescription(offer);

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  socket.emit("answer", { roomId, answer });
  }catch(err){
    console.error("Camera error:", err);
    alert("Camera not working!");
  }
});

// RECEIVE ANSWER
socket.on("answer", async (answer) => {
  status.innerText = "Connected 🎉";
  await pc.setRemoteDescription(answer);
});

// ICE
socket.on("candidate", async (candidate) => {
  try {
    await pc.addIceCandidate(candidate);
  } catch (e) {}
});
</script>

</body>
</html>
