# Basic PostgreSQL configuration for remote access
listen_addresses = '*'
port = 5432
max_connections = 100

# Logging
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_statement = 'ddl'

# Other settings
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all